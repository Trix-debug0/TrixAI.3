name: Trix AI Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q TrixAI-Final-Android.zip -d project

          if [ -d "project/TrixAI" ]; then
            echo "Nested TrixAI folder found"
            cp -r project/TrixAI/. project/
          fi

      - name: Fix Java and Kotlin JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle.kts")
          text = p.read_text()

          if "compileOptions" not in text:
              text = text.replace(
                  '    buildFeatures { buildConfig = true }',
                  '''    compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }

                  kotlinOptions {
                      jvmTarget = "17"
                  }

                  buildFeatures { buildConfig = true }'''
              )

          p.write_text(text)
          print(p.read_text())
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trix-AI-debug
          path: project/app/build/outputs/apk/debug/*.apk
